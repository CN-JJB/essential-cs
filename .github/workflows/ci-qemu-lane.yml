# Essential CS canonical stable CI — QEMU lane + m20 timing triage (Issue #145/#150, D-032).
#
# Same execution model as ci-fast.yml: hosted ubuntu-24.04 is substrate; release-relevant
# commands run inside the canonical environment materialized by pulling the SAME immutable
# registry digest committed in .devcontainer/canonical-image.env. This lane does not build
# an environment, and it consumes exactly the digest canonical-fast consumes.
# OQ-BP-006 stays OPEN until Web Lead acceptance after independent verification.
#
# V-147-01 repair (Issue #149): qemu-smoke is fail-closed. A green job must prove the real
# learner-owned ./smoke.sh executed and produced the required retained evidence
# (req02-smoke.log + PASS markers). The fixture uses printf/Python file-write (no indented
# nested heredoc); an in-step postcondition and a separate evidence-completeness gate make a
# green job impossible if the smoke never ran or the bundle is incomplete.
#
# - qemu-smoke is release-relevant and REQUIRED on its schedule (nightly + manual +
#   pre-release). Network-fetch flakes may be retried once as infra; smoke-semantic
#   failures are course findings and must be routed, never edited away here.
# - m20-timing-triage is a TEMPORARY diagnostic non-blocking lane (continue-on-error).
#   It characterizes the TestThreeServicePipelineIntegration trio (5 repeats, per-run
#   outcome table) and can NEVER count as stable-green Gate 3/5 evidence. It must be
#   removed or converted into a required gate only by a bounded follow-up Issue after the
#   nondeterminism is resolved or explicitly environment-classified with evidence.

name: canonical-qemu-lane

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CI_TREE: /tmp/ci-tree

jobs:
  qemu-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact dispatched revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact checked-out revision
        run: |
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_REVISION=${GITHUB_SHA}"
          echo "ACTUAL_REVISION=${actual}"
          test "${actual}" = "${GITHUB_SHA}"

      - name: Record hosted substrate identity (informational only, not the pin)
        run: |
          cat /etc/os-release | head -n 3
          echo "runner_image_version=${ImageVersion}"
          echo "runner_arch=$(uname -m)"

      - name: Materialize canonical environment by immutable registry digest
        # Same committed digest as canonical-fast. No build. The pull's local image
        # ID is recorded for audit and is explicitly not the pin.
        run: |
          set -ueo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          bash scripts/canonical-image-pull.sh

      - name: Assert this lane consumes the committed digest
        run: |
          set -ueo pipefail
          digest="$(sed -n 's/^CANONICAL_IMAGE_DIGEST=//p' .devcontainer/canonical-image.env)"
          echo "COMMITTED_CANONICAL_DIGEST=${digest}"
          echo "CONSUMED_CANONICAL_IMAGE=${CANONICAL_IMAGE}"
          case "${CANONICAL_IMAGE}" in
            *"@${digest}") echo "DIGEST_CONSUMPTION_ASSERT=PASS" ;;
            *) echo "FAIL: canonical image reference does not carry the committed digest"; exit 1 ;;
          esac
          docker image inspect "${CANONICAL_IMAGE}" --format 'CONSUMED_LOCAL_IMAGE_ID={{.Id}} ARCH={{.Architecture}} OS={{.Os}}'

      - name: Materialize LF tree for course execution
        run: |
          rm -rf "${CI_TREE}"
          mkdir -p "${CI_TREE}/.ci-logs"
          git -c core.autocrlf=false archive --format=tar HEAD | tar -x -C "${CI_TREE}"

      - name: Record canonical digest consumption in the retained evidence bundle
        run: |
          set -ueo pipefail
          {
            echo "lane=canonical-qemu-lane"
            echo "canonical_image=${CANONICAL_IMAGE}"
            echo "canonical_image_digest=${CANONICAL_IMAGE_DIGEST}"
            echo "committed_pin_digest=$(sed -n 's/^CANONICAL_IMAGE_DIGEST=//p' .devcontainer/canonical-image.env)"
            echo "local_image_id=$(docker image inspect "${CANONICAL_IMAGE}" --format '{{.Id}}')"
            echo "local_image_id_role=NOT-PIN (daemon-local)"
            echo "runner_image_version=${ImageVersion}"
            echo "git_sha=$(git rev-parse HEAD)"
          } | tee "${CI_TREE}/.ci-logs/canonical-digest-consumption.txt"

      - name: Canonical floor gate + version snapshot
        run: |
          docker run --rm -v "${CI_TREE}:/work" -w /work "${CANONICAL_IMAGE}" \
            bash /work/scripts/canonical-env-capture.sh | tee "${CI_TREE}/.ci-logs/qemu-env-snapshot.txt"

      - name: LAB-REQ-02 real QEMU lane (setup/source-route/fixture/smoke/fail-closed)
        # The smoke needs the documented learner change surface (worktree/user/sleep.c +
        # $U/_sleep registration). CI writes the minimal README-guided fixture itself so the
        # lane stays fully automated; the fixture is ephemeral scaffolding, never committed.
        # V-147-01: the fixture is written with printf + a short Python file-write instead of
        # an indented nested heredoc. YAML block-scalar stripping leaves the inner bash -c
        # script 2-space-indented, so a "<<EOF" terminator can never sit at column 0 and the
        # un-terminated heredoc silently swallows ./smoke.sh (false-green). The postcondition
        # after ./smoke.sh is fail-closed: the job fails unless the retained log proves the
        # real smoke executed (status, banner, standalone guest marker, reap/PID-marker clean).
        run: |
          docker run --rm -v "${CI_TREE}:/work" -w /work "${CANONICAL_IMAGE}" bash -c '
            set -ueo pipefail
            cd labs/lab-req-02-xv6-syscall
            ./preflight.sh | tee /work/.ci-logs/req02-preflight.log
            ./setup.sh | tee /work/.ci-logs/req02-setup.log
            python3 verify_source_route.py worktree | tee /work/.ci-logs/req02-source-route.log
            printf "%s\n" \
              "#include \"kernel/types.h\"" \
              "#include \"user/user.h\"" \
              "int" \
              "main(int argc, char *argv[])" \
              "{" \
              "  if(argc != 2){" \
              "    fprintf(2, \"Usage: sleep ticks\\n\");" \
              "    exit(1);" \
              "  }" \
              "  pause(atoi(argv[1]));" \
              "  exit(0);" \
              "}" > worktree/user/sleep.c
            printf "%s\n" \
              "import sys" \
              "p = sys.argv[1]" \
              "s = open(p).read()" \
              "T = chr(9); N = chr(10); B = chr(92)" \
              "anchor = T + \"\$U/_zombie\" + B" \
              "add = N + T + \"\$U/_sleep\" + B" \
              "assert anchor in s, \"UPROGS anchor not found\"" \
              "open(p, \"w\").write(s.replace(anchor, anchor + add, 1))" > /tmp/patch_uprogs.py
            python3 /tmp/patch_uprogs.py worktree/Makefile
            grep -q "U/_sleep" worktree/Makefile
            ./smoke.sh | tee /work/.ci-logs/req02-smoke.log
            SMOKE_LOG=/work/.ci-logs/req02-smoke.log
            test -s "${SMOKE_LOG}" || { echo "FAIL-CLOSED: req02-smoke.log missing or empty"; exit 1; }
            grep -q "QEMU_SMOKE_STATUS: PASS" "${SMOKE_LOG}" || { echo "FAIL-CLOSED: QEMU_SMOKE_STATUS: PASS marker absent"; exit 1; }
            grep -q "=== LAB-REQ-02 Smoke Test PASS ===" "${SMOKE_LOG}" || { echo "FAIL-CLOSED: final smoke PASS banner absent"; exit 1; }
            grep -qE "^[[:space:]]*LAB_REQ_02_OK[[:space:]]*\$" "${SMOKE_LOG}" || { echo "FAIL-CLOSED: standalone LAB_REQ_02_OK execution marker absent"; exit 1; }
            grep -q "QEMU_REAPED: TRUE" "${SMOKE_LOG}" || { echo "FAIL-CLOSED: QEMU_REAPED: TRUE absent"; exit 1; }
            grep -q "PID_MARKER_CLEAN: YES" "${SMOKE_LOG}" || { echo "FAIL-CLOSED: PID_MARKER_CLEAN: YES absent"; exit 1; }
            echo "REQ02_SMOKE_EVIDENCE: FAIL-CLOSED POSTCONDITION PASS"' 2>&1 | tee "${CI_TREE}/.ci-logs/qemu-lane-outer.log"
          test "${PIPESTATUS[0]}" -eq 0
        timeout-minutes: 40

      - name: LAB-REQ-02 cleanup truth (pin restored, residue gone, no strays)
        run: |
          docker run --rm -v "${CI_TREE}:/work" -w /work "${CANONICAL_IMAGE}" bash -c '
            set -ueo pipefail
            cd labs/lab-req-02-xv6-syscall
            ./reset.sh
            test "$(git -C worktree rev-parse HEAD)" = "35b088427ef37611c38afdeed5a52a278cae38f9"
            test -z "$(git -C worktree status --porcelain)"
            test ! -e .qemu_smoke.pid
            test -z "$(pgrep -f "[q]emu-system-riscv64" || true)"
            echo REQ02_CLEANUP_TRUTH_DONE'

      - name: QEMU evidence completeness gate (fail-closed)
        run: |
          set -ueo pipefail
          EVIDENCE_DIR="${CI_TREE}/.ci-logs"
          REQUIRED="qemu-env-snapshot.txt req02-preflight.log req02-setup.log req02-source-route.log req02-smoke.log qemu-lane-outer.log"
          for f in ${REQUIRED}; do
            if [ ! -s "${EVIDENCE_DIR}/${f}" ]; then
              echo "FAIL-CLOSED: required evidence file missing or empty: ${f}"
              exit 1
            fi
            echo "EVIDENCE_OK: ${f} ($(wc -c < "${EVIDENCE_DIR}/${f}") bytes)"
          done
          echo "QEMU_EVIDENCE_COMPLETE: FAIL-CLOSED GATE PASS"

      - name: Upload QEMU lane evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-qemu-evidence
          path: /tmp/ci-tree/.ci-logs/
          include-hidden-files: true

  m20-timing-triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout exact dispatched revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact checked-out revision
        run: |
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_REVISION=${GITHUB_SHA}"
          echo "ACTUAL_REVISION=${actual}"
          test "${actual}" = "${GITHUB_SHA}"

      - name: Materialize canonical environment by the same immutable registry digest
        run: |
          set -ueo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          bash scripts/canonical-image-pull.sh

      - name: Materialize LF tree for course execution
        run: |
          rm -rf "${CI_TREE}"
          mkdir -p "${CI_TREE}/.ci-logs"
          git -c core.autocrlf=false archive --format=tar HEAD | tar -x -C "${CI_TREE}"

      - name: m20 trio repeat characterization (diagnostic ONLY, never stable-green evidence)
        run: |
          docker run --rm -v "${CI_TREE}:/work" -w /work "${CANONICAL_IMAGE}" bash -c '
            cd labs/foundations/m20
            for i in 1 2 3 4 5; do
              if python3 -m unittest test_m20.TestThreeServicePipelineIntegration > "/work/.ci-logs/m20-trio-run$i.log" 2>&1; then
                echo "TRIO_RUN_$i=PASS"
              else
                echo "TRIO_RUN_$i=FAIL"
              fi
            done
            echo TRIAGE_REPEATS_DONE; exit 0' | tee "${CI_TREE}/.ci-logs/m20-trio-summary.txt"
          echo '## m20 timing triage (diagnostic, non-blocking — see workflow header)' >> "${GITHUB_STEP_SUMMARY}"
          cat "${CI_TREE}/.ci-logs/m20-trio-summary.txt" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload triage bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-m20-triage
          path: /tmp/ci-tree/.ci-logs/
          include-hidden-files: true
